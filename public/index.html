<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Control</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <p class="eyebrow">OpenClaw local-only read-only viewer</p>
        <h1>Mission Control</h1>
        <p class="subtle">Sub-agent runs, quick ops summary, and recent activity from local session history.</p>
      </div>
      <div class="topbar-actions">
        <label class="toggle-row">
          <input id="autoRefreshToggle" type="checkbox" checked />
          <span>Auto-refresh</span>
        </label>
        <button id="refreshBtn">Refresh</button>
      </div>
    </header>

    <section id="summary" class="summary"></section>

    <section class="toolbar">
      <div class="search-wrap">
        <label for="searchInput">Search</label>
        <input id="searchInput" type="search" placeholder="Task, label, requester, or session key" />
      </div>
      <div class="filter-wrap">
        <label for="statusFilter">Status</label>
        <select id="statusFilter">
          <option value="all">All statuses</option>
        </select>
      </div>
      <div class="filter-wrap">
        <label for="timeFilter">View</label>
        <select id="timeFilter">
          <option value="all">All history</option>
          <option value="today">Today</option>
          <option value="24h">Last 24h</option>
          <option value="7d">Last 7 days</option>
        </select>
      </div>
      <div class="toolbar-meta">
        <div id="resultsMeta" class="subtle">Loading…</div>
        <div id="refreshMeta" class="subtle"></div>
      </div>
    </section>

    <section id="runs" class="runs"></section>
  </main>

  <template id="runTemplate">
    <article class="run-card">
      <div class="run-head">
        <div>
          <div class="run-title-row">
            <span class="status-pill"></span>
            <h2 class="run-title"></h2>
          </div>
          <p class="run-meta"></p>
        </div>
        <div class="metrics"></div>
      </div>

      <div class="grid two">
        <section>
          <h3>Task</h3>
          <p class="summary-text task-summary"></p>
          <details><summary>Raw task</summary><pre class="raw task-raw"></pre></details>
        </section>
        <section>
          <h3>Input</h3>
          <p class="summary-text input-summary"></p>
          <details><summary>Raw input</summary><pre class="raw input-raw"></pre></details>
        </section>
      </div>

      <section>
        <h3>Output</h3>
        <p class="summary-text output-summary"></p>
        <details><summary>Raw output</summary><pre class="raw output-raw"></pre></details>
      </section>

      <details>
        <summary>Run details</summary>
        <div class="details-grid"></div>
      </details>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
